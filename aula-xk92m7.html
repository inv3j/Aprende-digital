<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- noindex: esta página no debe aparecer en buscadores -->
<meta name="robots" content="noindex, nofollow">
<title>Tus clases — Chef Gabi Snack Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<header class="topbar">
  <div class="envoltura">
    <a href="index.html" class="marca">Chef Gabi<span class="punto">.</span>Snack Academy</a>
  </div>
</header>

<main class="envoltura" style="padding-bottom:60px;">
  <span class="eyebrow">Tu aula</span>
  <h1 style="font-family:var(--display); font-size:clamp(28px,4vw,40px); margin:14px 0 6px;">Tus clases</h1>
  <p style="color:#7a6a60; max-width:60ch; margin-bottom:30px;">Aquí están todas tus clases. Puedes verlas cuantas veces quieras.</p>

  <div class="lista-clases" id="lista-clases">
    <!-- Se llena dinámicamente con clases.json -->
    <p style="color:#9a8a80;">Cargando tus clases...</p>
  </div>

  <div id="reproductor" style="display:none; margin-top:40px;">
    <h2 id="titulo-reproductor" style="font-family:var(--display); font-size:22px; margin-bottom:14px;"></h2>
    <div class="video-envoltura">
      <iframe id="iframe-video" src="" allow="autoplay" allowfullscreen></iframe>
    </div>
  </div>
</main>

<footer class="pie">
  <div class="envoltura">Chef Gabi Snack Academy — todos los derechos reservados.</div>
</footer>

<script src="aula.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- noindex: esta página no debe aparecer en buscadores -->
<meta name="robots" content="noindex, nofollow">
<title>Tus clases — Chef Gabi Snack Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<header class="topbar">
  <div class="envoltura">
    <a href="index.html" class="marca">Chef Gabi<span class="punto">.</span>Snack Academy</a>
  </div>
</header>

<main class="envoltura" style="padding-bottom:60px;">
  <span class="eyebrow">Tu aula</span>
  <h1 style="font-family:var(--display); font-size:clamp(28px,4vw,40px); margin:14px 0 18px;">Tus módulos</h1>

  <nav class="panel-modulos" id="panel-modulos">
    <p style="color:#9a8a80; font-size:14px;">Cargando módulos...</p>
  </nav>

  <div class="contenido-modulo">
    <p class="migas" id="migas"></p>
    <h2 id="titulo-modulo-activo">—</h2>
    <span class="cuenta-total" id="cuenta-total-modulo"></span>

    <div class="mensaje-modulo" id="mensaje-modulo"></div>

    <div id="reproductor" style="display:none;">
      <h3 id="titulo-reproductor" style="font-family:var(--display); font-size:18px; margin-bottom:14px;"></h3>
      <div class="video-envoltura" id="envoltura-video">
        <iframe id="iframe-video" src="" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen webkitallowfullscreen mozallowfullscreen></iframe>
      </div>

      <div class="nav-clases">
        <button id="btn-anterior" class="boton-nav">‹ Anterior</button>
        <button id="btn-siguiente" class="boton-nav boton-nav-primario">Siguiente ›</button>
      </div>
    </div>

    <p class="titulo-lista">Todo el contenido de este módulo</p>
    <div class="lista-clases" id="lista-clases"></div>
  </div>
</main>

<footer class="pie">
  <div class="envoltura">Chef Gabi Snack Academy — todos los derechos reservados.</div>
</footer>

<script src="aula.js"></script>
</body>
</html>
